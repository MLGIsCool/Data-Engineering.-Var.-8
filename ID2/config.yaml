base_url: "https://ru.tradingview.com/markets/currencies/rates-all/"
tabs:
  overview:
    name: "Обзор"
    tab_text: "Обзор"
    columns: [name, price, change_percent, change_abs, bid, ask, low_24h, high_24h, tech_rating]
  dynamics:
    name: "Динамика"
    tab_text: "Динамика"
    columns: [name, change_1d, change_1w, change_1m, change_3m, change_6m, change_1y, change_5y, change_10y, change_all, volatility]
  tech:
    name: "Теханализ"
    tab_text: "Теханализ"
    columns: [name, tech_rating_1d, ma_rating, osc_rating, rsi, mom, cci, macd_level, macd_signal]
max_items: 100
cache_ttl_minutes: 60

paths:
  base_dir: "."
  data_dir: "data"
  cache_dir: "cache"
  logs_dir: "logs"
  errors_log: "tradingview_scraper.log"

selenium:
  headless: true
  page_load_timeout: 60
  wait_timeout: 20
  scroll_pause: 2
  max_scrolls: 20